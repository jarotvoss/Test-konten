name: Auto Reels Producer

on:
  workflow_dispatch:

jobs:
  build-reel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install FFmpeg & Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install edge-tts faster-whisper

      - name: Generate Voiceover & Subtitles
        run: python generate_voice.py

      - name: Render Final Video
        run: python render_video.py

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: finished-reels
          path: final_reels_output.mp4
